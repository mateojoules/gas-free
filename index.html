<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gas Free</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0f;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            text-align: center;

            background: #15151c;

            border-radius: 24px;

            padding: 40px 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 24px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            color: black;

            font-size: 30px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 32px;
            font-weight: 700;
        }

        p {
            margin: 0 auto 30px;

            max-width: 320px;

            color: #aaaab5;

            line-height: 1.5;
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 14px;

            padding: 17px;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            background: white;
            color: black;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #status {
            margin-top: 18px;

            min-height: 20px;

            font-size: 14px;

            color: #aaaab5;
        }
    </style>
</head>


<body>

    <div class="card">

        <div class="logo">
            G
        </div>

        <h1>
            Gas Free
        </h1>

        <p>
            Switch your TronLink network to continue.
        </p>

        <button id="switchButton">
            Switch to Gas Free
        </button>

        <div id="status"></div>

    </div>


<script>

    /*
     * TronLink's Nile network ID.
     *
     * This is intentionally kept in the code rather than
     * displayed to the user.
     */
    const GAS_FREE_CHAIN_ID = "0xcd8690dc";


    const button =
        document.getElementById("switchButton");

    const status =
        document.getElementById("status");


    async function switchToGasFree() {

        button.disabled = true;

        status.textContent =
            "Please approve the switch in TronLink...";


        try {

            /*
             * Check that TronLink is available.
             */
            if (!window.tron) {

                status.textContent =
                    "Please open this page inside TronLink.";

                button.disabled = false;

                return;
            }


            /*
             * Ask TronLink to switch networks.
             */
            await window.tron.request({

                method:
                    "wallet_switchEthereumChain",

                params: [
                    {
                        chainId:
                            GAS_FREE_CHAIN_ID
                    }
                ]

            });


            /*
             * Successful switch.
             */
            status.textContent =
                "Gas Free is active.";


        } catch (error) {

            console.error(error);


            /*
             * User rejected the request.
             */
            if (error && error.code === 4001) {

                status.textContent =
                    "Switch cancelled.";

            } else {

                status.textContent =
                    "Please approve the switch in TronLink.";

            }


            button.disabled = false;
        }
    }


    /*
     * Button click.
     */
    button.addEventListener(
        "click",
        switchToGasFree
    );


    /*
     * Detect network changes.
     */
    if (
        window.tron &&
        window.tron.on
    ) {

        window.tron.on(
            "chainChanged",
            function ({ chainId }) {

                if (
                    chainId ===
                    GAS_FREE_CHAIN_ID
                ) {

                    status.textContent =
                        "Gas Free is active.";

                    button.disabled = true;
                }

            }
        );

    }

</script>

</body>
</html>
