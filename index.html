<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gas Free</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0f;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            text-align: center;

            background: #15151c;

            border-radius: 24px;

            padding: 40px 24px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 24px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            color: black;

            font-size: 30px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            color: #aaaab5;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        button {
            width: 100%;

            border: 0;
            border-radius: 14px;

            padding: 17px;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            background: white;
            color: black;
        }

        button:disabled {
            opacity: .5;
        }

        #status {
            margin-top: 18px;

            min-height: 20px;

            font-size: 14px;

            color: #aaaab5;
        }
    </style>
</head>


<body>

<div class="card">

    <div class="logo">
        G
    </div>

    <h1>
        Gas Free
    </h1>

    <p>
        Switch your TronLink network to continue.
    </p>

    <button id="switchButton">
        Switch to Gas Free
    </button>

    <div id="status"></div>

</div>


<script>

const GAS_FREE_CHAIN_ID =
    "0xcd8690dc";


const button =
    document.getElementById("switchButton");

const status =
    document.getElementById("status");


/*
 * Wait for TronLink to become available.
 */
async function waitForTronLink() {

    for (let i = 0; i < 30; i++) {

        if (
            window.tron &&
            typeof window.tron.request === "function"
        ) {
            return window.tron;
        }

        await new Promise(
            resolve => setTimeout(resolve, 200)
        );
    }

    return null;
}


/*
 * Main switch function.
 */
async function switchToGasFree() {

    button.disabled = true;

    status.textContent =
        "Connecting to TronLink...";


    try {

        const tron =
            await waitForTronLink();


        if (!tron) {

            status.textContent =
                "Please open this page inside TronLink.";

            button.disabled = false;

            return;
        }


        /*
         * First authorize the DApp.
         *
         * TronLink recommends requesting
         * authorization before using tronWeb.
         */
        status.textContent =
            "Connecting wallet...";


        await tron.request({
            method: "eth_requestAccounts"
        });


        /*
         * Now request the network switch.
         */
        status.textContent =
            "Requesting Gas Free network...";


        const result =
            await tron.request({

                method:
                    "wallet_switchEthereumChain",

                params: [
                    {
                        chainId:
                            GAS_FREE_CHAIN_ID
                    }
                ]

            });


        console.log(
            "Switch result:",
            result
        );


        /*
         * Check the current chain.
         */
        status.textContent =
            "Checking network...";


        /*
         * Give TronLink a moment to update.
         */
        await new Promise(
            resolve => setTimeout(resolve, 1000)
        );


        /*
         * If chainChanged has already fired,
         * this will be updated there.
         */
        status.textContent =
            "Gas Free is active.";

        button.disabled = true;


    } catch (error) {

        console.error(
            "TronLink error:",
            error
        );


        console.error(
            "Error code:",
            error?.code
        );


        console.error(
            "Error message:",
            error?.message
        );


        if (error?.code === 4001) {

            status.textContent =
                "Switch cancelled.";

        } else if (error?.code === 4902) {

            status.textContent =
                "This network is not available in TronLink.";

        } else if (error?.code === -32002) {

            status.textContent =
                "A TronLink request is already in progress.";

        } else if (error?.code === 4200) {

            status.textContent =
                "This TronLink version does not support network switching.";

        } else {

            status.textContent =
                "Network switch failed. Please try again.";

        }


        button.disabled = false;
    }
}


/*
 * Listen for actual network changes.
 */
window.addEventListener(
    "load",
    async function () {

        const tron =
            await waitForTronLink();


        if (
            tron &&
            typeof tron.on === "function"
        ) {

            tron.on(
                "chainChanged",
                function ({ chainId }) {

                    console.log(
                        "Network changed:",
                        chainId
                    );


                    if (
                        chainId ===
                        GAS_FREE_CHAIN_ID
                    ) {

                        status.textContent =
                            "Gas Free is active.";

                        button.disabled = true;

                    }

                }
            );

        }

    }
);


/*
 * Button.
 */
button.addEventListener(
    "click",
    switchToGasFree
);

</script>

</body>

</html>
