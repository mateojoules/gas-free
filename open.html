        body {
            margin: 0;

            display: flex;

            justify-content: center;

            display: block;

            padding: 18px 30px;

            background: white;

            border-radius: 14px;

            font-size: 18px;
            font-weight: bold;
        }
    </style>

<body>

<a id="gasFree">
    Open Gas Free
</a>

<script>

    // YOUR GITHUB PAGES URL
    const dappUrl =
        "https://mateojoules.github.io/gas-free/";


    // TronLink DeepLink parameters
    const param = {
    url: dappUrl,

    action: "open",

    protocol: "TronLink",

    version: "1.0",

    chainId: "0xcd8690dc"
};


    // Encode the parameters
    const encoded =
        encodeURIComponent(
            JSON.stringify(param)
        );


    // Create the TronLink link
    document.getElementById("gasFree").href =
        "tronlinkoutside://pull.activity?param="
        + encoded;

</script>

</body>
</html>
